# Render.com Blueprint — LocalBuddy MVP backend
# Single web service (Express API). Realtime is handled client-side via
# Firestore listeners, so no worker/socket process is needed.

services:
  - type: web
    name: localbuddy-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Node
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: HOST
        value: "0.0.0.0"

      # Firebase Admin (Firebase Console > Service Accounts)
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false

      # JWT (internal use)
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRY
        value: "7d"

      # PayU (Test Mode from PayU Merchant Dashboard)
      - key: PAYU_MERCHANT_KEY
        sync: false
      - key: PAYU_MERCHANT_SALT
        sync: false
      - key: PAYU_BASE_URL
        value: "https://test.payu.in"

      # MojoAuth — Email OTP
      - key: MOJOAUTH_API_KEY
        sync: false
      - key: MOJOAUTH_API_SECRET
        sync: false
      - key: MOJOAUTH_BASE_URL
        value: "https://api.mojoauth.com"

      # Rate limiting
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "100"
      - key: OTP_RATE_LIMIT_MAX
        value: "3"

      # Security
      - key: CORS_ORIGIN
        sync: false

      # App URL used for PayU redirect deep-links
      - key: APP_URL
        sync: false
