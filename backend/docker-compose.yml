version: '3.8'

services:
  # Backend API Server
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: localbuddy-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      # Firebase Admin (required)
      - FIREBASE_ADMIN_PROJECT_ID=${FIREBASE_ADMIN_PROJECT_ID}
      - FIREBASE_ADMIN_CLIENT_EMAIL=${FIREBASE_ADMIN_CLIENT_EMAIL}
      - FIREBASE_ADMIN_PRIVATE_KEY=${FIREBASE_ADMIN_PRIVATE_KEY}
      # Supabase (required)
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      # PayU (required for payments)
      - PAYU_MERCHANT_KEY=${PAYU_MERCHANT_KEY}
      - PAYU_SALT=${PAYU_SALT}
      - PAYU_BASE_URL=${PAYU_BASE_URL:-https://test.payu.in}
      # Cloudinary (required for uploads)
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      # Fast2SMS (for OTP)
      - FAST2SMS_API_KEY=${FAST2SMS_API_KEY}
      # Brevo (for emails)
      - BREVO_API_KEY=${BREVO_API_KEY}
      # FCM
      - FCM_SERVER_KEY=${FCM_SERVER_KEY}
      # App Config
      - APP_URL=${APP_URL:-http://localhost:3000}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:8081}
      - JWT_SECRET=${JWT_SECRET}
    env_file:
      - .env.local
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - localbuddy-network

  # Optional: Redis for caching/sessions (if needed later)
  # redis:
  #   image: redis:7-alpine
  #   container_name: localbuddy-redis
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis-data:/data
  #   networks:
  #     - localbuddy-network
  #   restart: unless-stopped

networks:
  localbuddy-network:
    driver: bridge

